[package]
name = "pearljs-verify-proof"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
# Exports build_setup, to time compiling the circuits in place of loading a cache.
measure-setup = []

[dependencies]
zk-pow = { path = "vendor/zk-pow", default-features = false }
anyhow = "1.0"
blake3 = "1.8"
# rand 0.9 needs a getrandom 0.3 backend to link on wasm32-unknown-unknown (.cargo/config.toml).
getrandom = { version = "0.3", features = ["wasm_js"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[workspace]
